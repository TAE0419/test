<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakao Map Search</title>
    <link rel="stylesheet" href="./reset.css"/>
    <style>
        body{width: 100%;height: 100vh; position: relative;}
        #map{width: 100%; height: 100%;}
        .searchBox{
            width: 700px; height: 80px; 
            background-color: rgb(49, 92, 209); border-radius: 100px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
            position: absolute; left: 50%;top: 5%; transform: translateX(-50%); z-index:10; 
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        #inputText{
            width: 76%; height: 80%; border-radius: 100px; text-align: center;
            border:none;
        }
        #btn{
            width: 20%; height: 80%; font-size:30px; font-weight: bold; color: rgb(255, 255, 255);
        }

        .infoBox{
            transform: translate(-3px,-3px);
            width: 250px; height: 50px; padding: 5px;
            border-radius: 5px; position: absolute; background-color: rgb(255, 255, 255);
            border: 2px solid rgb(49, 92, 209);
            display: flex; justify-content: center;align-items: center;
        }
        h2{font-size: 15px;}
        .closeBtn{
            position: absolute; right: 5px;top: 0;
            color:rgb(49, 92, 209);
        }
    </style>
</head>
<body>
    <div class="searchBox">
        <input id="inputText" type="text" placeholder="키워드를 입력하세요">
        <button id="btn">검색</button>
    </div>

    <div id="map"></div>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b0db25af50471b724b0ca5d241661c64&libraries=services"></script>

    <script>
        window.closeMyInfoWindow = function() {
    infowindow.close();
};

        var infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });
        var markers = [];

        var mapContainer = document.getElementById('map');
        var mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567),
            level: 3
        };

        var map = new kakao.maps.Map(mapContainer, mapOption);
        var ps = new kakao.maps.services.Places();

        var btn = document.querySelector('#btn');
        var input = document.querySelector('#inputText');

        btn.addEventListener('click', function () {
            searchPlace();
        });

        input.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                searchPlace();
            }
        });

        function searchPlace() {
            var keyword = input.value.trim();

            if (keyword === '') {
                alert('검색어를 입력하세요.');
                return;
            }

            clearMarkers();
            ps.keywordSearch(keyword, placesSearchCB);
        }

        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                var bounds = new kakao.maps.LatLngBounds();

                for (var i = 0; i < data.length; i++) {
                    displayMarker(data[i]);
                    bounds.extend(new kakao.maps.LatLng(data[i].y, data[i].x));
                }

                map.setBounds(bounds);
            }
        }

        function displayMarker(place) {
            var marker = new kakao.maps.Marker({
                map: map,
                position: new kakao.maps.LatLng(place.y, place.x)
            });

            markers.push(marker);

            kakao.maps.event.addListener(marker, 'click', function () {
                infowindow.setContent(`
                <div class="infoBox">
                    <div class='top'>
                        <h2>${place.place_name}<h2>
                        <button class="closeBtn" onclick='window.closeMyInfoWindow()'>X</button>
                    </div>
                </div>`
                );
                infowindow.open(map, marker);
            });
        }

        function clearMarkers() {
            for (var i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }

            markers = [];
            infowindow.close();
        }

    
    </script>
</body>
</html>
